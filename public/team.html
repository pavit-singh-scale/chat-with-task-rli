<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team — RLI Operations Hub</title>
  <link rel="stylesheet" href="/css/studio.css" />
  <link rel="icon" href="/scale-icon.svg" />
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="topbar" id="app-header"></header>

  <!--
    ONE job: the work on RLI, and who owns it.

    The previous version rendered the same eight items three times — as a health
    signal, again under "Escalated", and again inside a per-person column — so
    you read a problem at the top and then scrolled past two more copies to find
    the one with buttons on it. The severity tiles were decoration; they filtered
    nothing.

    Now there is one card per item, grouped under its owner, carrying its own
    evidence and its own actions. The counts across the top are the filter.
  -->
  <main class="tm-main">
    <header class="tm-top">
      <div class="tm-top__title">
        <h1>Team</h1>
        <p class="tm-sub" id="tm-sub">Loading…</p>
      </div>
      <div class="tm-top__actions">
        <button class="btn btn--ghost" id="tm-export" type="button"
                title="Copy the visible items as one-line bullets for the running-history doc">Export</button>
        <button class="btn btn--ghost" id="tm-refresh" type="button">Refresh</button>
      </div>
    </header>

    <div class="tm-filters" id="tm-filters" role="group" aria-label="Filter work"></div>

    <div class="tm-owners" id="tm-owners"></div>

    <p class="tm-foot" id="tm-foot"></p>
  </main>

  <script type="module" src="/js/team.js"></script>
</body>
</html>
