<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task — RLI Operations Hub</title>
  <link rel="stylesheet" href="/css/studio.css" />
  <link rel="icon" href="/scale-icon.svg" />
  <script src="/js/theme.js"></script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <!-- The glyph and the arrow share one fixed 14px slot; only opacity and
         transform animate, so hovering never reflows the header. -->
    <a class="backlink" href="/" title="Back to the board">
      <span class="backlink__slot">
        <svg viewBox="0 0 479.82 479.83" role="img" aria-label="Scale"><path d="M452.28,0H27.6C3.06,0-9.23,29.67,8.12,47.02l424.69,424.69c17.35,17.35,47.02,5.06,47.02-19.48V27.54c0-15.21-12.33-27.54-27.54-27.54Z"></path><path d="M198.08,269.69H12.67c-10.71,0-16.08,12.95-8.5,20.53l185.4,185.4c7.58,7.58,20.53,2.21,20.53-8.5v-185.4c0-6.64-5.38-12.02-12.02-12.02Z"></path></svg>
        <span class="backlink__arrow" aria-hidden="true">←</span>
      </span>
      <span class="backlink__label">Board</span>
    </a>
    <button class="tag sev-pill" id="sev-chip" title="reclassify severity"></button>
    <span class="mono task-id" id="task-id"></span>
    <div class="spacer"></div>

    <span class="claim-who" id="claim-who"></span>
    <button class="btn btn--ghost claim-btn" id="claim-btn"
            title="Claim on THIS board — team bookkeeping only, never touches the platform"></button>
    <span class="divider" aria-hidden="true"></span>
    <!-- The two claims act on different systems, so they must not look like
         siblings: the board claim is quiet local chrome, the platform claim is
         a tinted pill that says where it goes and leaves the app. -->
    <a class="btn-platform" id="force-claim" target="_blank" rel="noopener"
       title="Opens this task on the Outlier platform with forceClaim=1 — claims it THERE, not on this board">
      <svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true"><path fill="currentColor" d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>
      Claim on Outlier</a>

    <select class="select" id="verdict-select" title="set your decision">
      <option value="">Set decision…</option>
      <option value="NO_ISSUES">No issues</option>
      <option value="FIXES_MADE">Fixes made</option>
      <option value="GRAMMAR_ONLY">Grammar-only</option>
      <option value="SBQ">SBQ</option>
      <option value="SECOND_OPINION">Second opinion needed</option>
    </select>

    <!-- Destructive / rare actions live behind the overflow, not top-level. -->
    <div class="menu" id="more-menu">
      <button class="btn btn--icon" type="button" id="more-btn" title="More actions">⋯</button>
      <div class="menu__list menu__list--wide" id="more-list" hidden>
        <button type="button" id="copy-task-id">Copy task ID</button>
        <button type="button" id="copy-board-link">Copy board link</button>
        <button type="button" id="copy-outlier-link">Copy Outlier claim link</button>
        <div class="menu__sep"></div>
        <button type="button" id="dl-rank">Download rank.json <span class="menu__hint">current state</span></button>
        <button type="button" id="dl-ledger">Download fix ledger <span class="menu__hint">audit trail</span></button>
        <div class="menu__sep"></div>
        <button type="button" id="tour-btn">Take a tour</button>
        <button type="button" class="menu__danger" id="delete-task" hidden>Delete task</button>
      </div>
    </div>
    <button class="btn btn--icon" type="button" data-theme-toggle title="Switch theme">☀</button>
    <div class="userblock" id="user-chip" hidden>
      <span class="avatar" id="user-avatar"></span>
      <span class="userblock__name" id="user-name"></span>
      <button class="btn btn--ghost userblock__out" type="button" id="logout-btn">Sign out</button>
    </div>
  </header>

  <div class="strip" id="task-strip"></div>

  <div class="tabs" id="tabs" role="tablist">
    <div class="spacer"></div>
    <!-- Files, the QC spec, CB responses and the ranking proof were four more
         sidebar sections; they collapse into one overflow menu. -->
    <div class="menu" id="files-menu">
      <button class="btn tabs__more" type="button" id="files-btn">Files ▾</button>
      <div class="menu__list menu__list--wide" id="files-list" hidden></div>
    </div>
  </div>

  <div class="workspace">
    <main class="doc" id="viewer">
      <div class="traj-toolbar" id="traj-toolbar" hidden>
        <div class="traj-tabs" id="traj-tabs"></div>
        <button class="btn btn--ghost" id="collapse-all">Collapse all</button>
      </div>
      <button class="btn btn--ghost doc__back" id="back-btn" hidden></button>
      <div class="doc__inner" id="viewer-body"></div>
    </main>

    <aside class="acey" id="chat-panel">
      <div class="acey__head">
        <img src="/copilot.png" alt="" />
        <b>Acey</b>
        <div class="spacer"></div>
        <div class="seg" id="copilot-mode" role="group" aria-label="Copilot mode"
             title="Static = a written answer with citation chips. Dynamic = a clickable, step-by-step walkthrough of the evidence.">
          <button type="button" data-mode="static" aria-pressed="true">Static</button>
          <button type="button" data-mode="dynamic" aria-pressed="false">Dynamic</button>
        </div>
        <button class="btn btn--ghost acey__clear" type="button" id="clear-chat">Clear</button>
        <button class="btn btn--ghost acey__hide" type="button" id="collapse-chat" title="hide Acey">✕</button>
      </div>
      <div class="acey__body" id="chat-log"></div>
      <div class="acey__status" id="chat-status"></div>
      <div class="acey__composer">
        <textarea id="chat-text" placeholder="Ask about this task…"></textarea>
        <button class="btn btn--primary" id="chat-send">Send</button>
      </div>
    </aside>
  </div>
</div>

<!-- Collapsed Acey: the same round mascot, fixed bottom-right, as every other
     page. One access point, one corner, everywhere. -->
<button class="acey-fab" id="show-acey" hidden title="Ask Acey (⌘K)" aria-label="Ask Acey">
  <img src="/copilot.png" alt="" />
</button>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script type="module" src="/js/task.js"></script>
</body>
</html>
